[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfarer"
version = "0.1.0"
description = "Multi-agent AI travel planning system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "groq>=0.9.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "duckduckgo-search>=6.0.0",
    "model2vec>=0.10.0",
    "numpy>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["ruff==0.15.20", "mypy", "pytest>=8", "pytest-randomly"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff.lint]
# Pinned with the ruff version so a new release cannot change what counts as clean.
select = ["E4", "E7", "E9", "F"]
